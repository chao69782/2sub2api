services:
  workbench:
    build:
      context: .
    container_name: openai-auth-workbench
    restart: unless-stopped
    ports:
      - "1000:1000"
    cap_add:
      - NET_BIND_SERVICE
    shm_size: "1gb"
    environment:
      APP_CONFIG_FILE: /app/config/config.yaml
      DATA_DIR: /app/data
      CHROME_EXECUTABLE_PATH: /usr/bin/chromium-browser
      AUTH_BROWSER_HEADLESS: "true"
      AUTH_BROWSER_NO_SANDBOX: "true"
    volumes:
      - ./config.yaml:/app/config/config.yaml:ro
      - ./data:/app/data
    secrets:
      - workbench_admin_password
      - app_master_key
      - app_session_secret
      - sub2api_admin_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 223.5.5.5
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  workbench_admin_password:
    file: ./secrets/workbench_admin_password.txt
  app_master_key:
    file: ./secrets/app_master_key.txt
  app_session_secret:
    file: ./secrets/app_session_secret.txt
  sub2api_admin_key:
    file: ./secrets/sub2api_admin_key.txt
